<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Test</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = {
        config: {
          darkMode: "class",
        },
      };
    </script>
    <script src="index.js" defer></script>
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <label class="relative inline-flex items-center cursor-pointer mt-4">
  <input type="checkbox" id="theme-toggle" class="sr-only peer" />
  
  <!-- Track -->
  <div class="w-14 h-7 bg-gray-300 dark:bg-gray-600 rounded-full peer-focus:ring-2 peer-focus:ring-indigo-500 transition-colors peer-checked:bg-indigo-500"></div>
  
  <!-- Knob -->
  <div class="absolute left-0.5 top-0.5 w-6 h-6 bg-white rounded-full shadow-md border border-gray-300 dark:border-gray-500 peer-checked:translate-x-7 transition-transform"></div>
</label>


    <div
      class="bg-white dark:bg-gray-800 text-black dark:text-white p-6 rounded-lg mt-4"
    >
      <h2 class="text-lg font-semibold">Card with Dark Mode</h2>
      <p class="text-gray-500 dark:text-gray-400">
        This card changes when dark mode is toggled.
      </p>
    </div>
  </body>
</html>
